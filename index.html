<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa de Montalvo · Recorrido en video</title>
<meta name="description" content="La historia de cada sala de la Casa de Montalvo, en Ambato, contada en video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --piedra: #E9EDE8;
  --papel: #F6F8F5;
  --tinta: #17211E;
  --tinta-suave: #4B5A55;
  --verde: #1F4A3D;
  --verde-oscuro: #14322A;
  --laton: #9A6F22;
  --rojo: #D8312B;
  --verde-bandera: #00A056;
  --linea: #C9D1CB;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --texto: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--piedra);
  color: var(--tinta);
  font-family: var(--texto);
  line-height: 1.6;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--laton); outline-offset: 2px; }

header.portada {
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
.portada .franja { padding-left: clamp(1.25rem, 6vw, 5rem); padding-right: clamp(1.25rem, 6vw, 5rem); }
.portada .franja > div { max-width: 78rem; margin: 0 auto; }
.portada .roja { background: var(--rojo); }
.portada .verde { background: var(--verde-bandera); }
.portada .arriba { padding-top: clamp(1.25rem, 3vw, 2rem); padding-bottom: clamp(1rem, 2.5vw, 1.75rem); }
.portada .centro { padding-top: clamp(1.5rem, 4vw, 3rem); padding-bottom: clamp(1.5rem, 4vw, 3rem); }
.portada .abajo { padding-top: clamp(1.25rem, 3vw, 2rem); padding-bottom: clamp(1.5rem, 3.5vw, 2.5rem); }
.portada .lugar { margin: 0; color: #fff; font-weight: 600; font-size: 1.05rem; }
.portada .carrera { margin: 1rem 0 0; color: #fff; font-weight: 600; font-size: 1.05rem; }
.portada h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.8rem, 8.5vw, 6.5rem);
  line-height: .95;
  letter-spacing: -.01em;
}
.portada .bajada { margin: 0; max-width: 34rem; font-size: 1.15rem; color: #fff; }

main {
  display: grid;
  grid-template-columns: minmax(250px, 340px) 1fr;
  gap: clamp(1.25rem, 3vw, 3rem);
  max-width: 78rem;
  margin: 0 auto;
  padding: clamp(1.25rem, 4vw, 3rem) clamp(1.25rem, 4vw, 3rem) 4rem;
}

.ruta h2 {
  margin: 0 0 .75rem;
  font-family: var(--display);
  font-size: 1.7rem;
  font-weight: 600;
}
.ruta ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--linea); }
.ruta li { margin: 0; }
.ruta button {
  display: grid;
  grid-template-columns: 2.2rem 1fr;
  align-items: baseline;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-left: 4px solid transparent;
  margin-left: -2px;
  padding: .8rem 1rem;
  font: inherit;
  color: var(--tinta-suave);
  cursor: pointer;
}
.ruta button:hover { background: var(--papel); color: var(--tinta); }
.ruta .num { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--laton); }
.ruta .nombre { font-weight: 500; }
.ruta button[aria-current="true"] {
  background: var(--papel);
  color: var(--verde-oscuro);
  border-left-color: var(--verde);
}
.ruta button[aria-current="true"] .nombre { font-weight: 600; }

.sala { min-width: 0; }
.marco {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--verde-oscuro);
  border-radius: 4px;
  overflow: hidden;
}
.marco iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pendiente {
  position: absolute; inset: 0;
  display: grid; place-content: center; text-align: center;
  padding: 1.5rem; color: #D5DDD8;
}
.pendiente strong { font-family: var(--display); font-size: 2rem; color: var(--papel); }
.sala h2 {
  margin: 1.5rem 0 .5rem;
  font-family: var(--display);
  font-size: clamp(2rem, 4vw, 3rem);
  line-height: 1.05;
  font-weight: 700;
  color: var(--verde-oscuro);
}
.sala p { margin: 0; max-width: 40rem; font-size: 1.08rem; color: var(--tinta-suave); }
.pasos { display: flex; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
.pasos button {
  font: inherit; font-weight: 600;
  padding: .65rem 1.2rem;
  border: 2px solid var(--verde);
  background: var(--verde);
  color: var(--papel);
  border-radius: 3px;
  cursor: pointer;
}
.pasos button.sec { background: transparent; color: var(--verde); }
.pasos button:disabled { opacity: .4; cursor: not-allowed; }

footer {
  max-width: 78rem; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 3rem) 3rem;
  color: var(--tinta-suave); font-size: .95rem;
}

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  .sala { order: -1; }
  .ruta ol { border-left: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="portada">
  <div class="franja roja arriba"><div>
    <p class="lugar">Museo en Ambato, Tungurahua, Ecuador</p>
  </div></div>
  <div class="franja verde centro"><div>
    <h1>Casa de Montalvo</h1>
  </div></div>
  <div class="franja roja abajo"><div>
    <p class="bajada">Recorre el museo sala por sala. Cada video cuenta la historia del espacio que estás viendo.</p>
    <p class="carrera">Carrera de Ingeniería en Telecomunicaciones (UTA)</p>
  </div></div>
</header>

<main>
  <nav class="ruta" aria-label="Salas del museo">
    <h2>Salas</h2>
    <ol id="lista"></ol>
  </nav>

  <article class="sala" aria-live="polite">
    <div class="marco" id="marco"></div>
    <h2 id="titulo"></h2>
    <p id="descripcion"></p>
    <div class="pasos">
      <button type="button" class="sec" id="anterior">Sala anterior</button>
      <button type="button" id="siguiente">Siguiente sala</button>
    </div>
  </article>
</main>

<footer>Proyecto académico · Universidad Técnica de Ambato</footer>

<script>
/*
  ============  AQUÍ AGREGAS TUS VIDEOS  ============
  1. Sube el video a YouTube y márcalo como "No listado".
  2. Copia el código del enlace. En https://youtu.be/AbC123xyz el código es AbC123xyz.
  3. Pégalo en "youtube" de la sala que corresponda.
  4. Cambia "titulo" y "descripcion" por el nombre real de la sala.
  Para agregar una sala nueva, copia una línea completa y pégala debajo.
*/
const SALAS = [
  { titulo: "Sala 1", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 2", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 3", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 4", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 5", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 6", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 7", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 8", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 9", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 10", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" },
  { titulo: "Sala 11", descripcion: "Escribe aquí una breve descripción de esta sala.", youtube: "" }
];
/* ================================================== */

const lista = document.getElementById("lista");
const marco = document.getElementById("marco");
const titulo = document.getElementById("titulo");
const descripcion = document.getElementById("descripcion");
const anterior = document.getElementById("anterior");
const siguiente = document.getElementById("siguiente");
let actual = 0;

SALAS.forEach((s, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="nombre"></span>';
  b.querySelector(".nombre").textContent = s.titulo;
  b.addEventListener("click", () => mostrar(i));
  li.appendChild(b);
  lista.appendChild(li);
});

function mostrar(i, desdeHash) {
  actual = Math.max(0, Math.min(SALAS.length - 1, i));
  const s = SALAS[actual];
  titulo.textContent = s.titulo;
  descripcion.textContent = s.descripcion;
  marco.innerHTML = "";
  if (s.youtube) {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(s.youtube) + "?rel=0";
    f.title = "Video de " + s.titulo;
    f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    marco.appendChild(f);
  } else {
    const p = document.createElement("div");
    p.className = "pendiente";
    p.innerHTML = "<div><strong>Video en preparación</strong><br>Pronto podrás ver la historia de esta sala.</div>";
    marco.appendChild(p);
  }
  lista.querySelectorAll("button").forEach((b, k) => {
    if (k === actual) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  });
  anterior.disabled = actual === 0;
  siguiente.disabled = actual === SALAS.length - 1;
  document.title = s.titulo + " · Casa de Montalvo";
  if (!desdeHash) history.replaceState(null, "", "#sala-" + (actual + 1));
}

anterior.addEventListener("click", () => mostrar(actual - 1));
siguiente.addEventListener("click", () => mostrar(actual + 1));

const m = location.hash.match(/^#sala-(\d+)$/);
mostrar(m ? parseInt(m[1], 10) - 1 : 0, true);
</script>
</body>
</html>
